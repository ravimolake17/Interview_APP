# nginx — Interview-Proctor VM (proctor.rrglobal.com)
# WebSocket required for Agent 5 live room
# Enable: sudo ln -sf /etc/nginx/sites-available/proctor /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name proctor.rrglobal.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name proctor.rrglobal.com;

    ssl_certificate     /etc/ssl/rrglobal/proctor.fullchain.crt;
    ssl_certificate_key /etc/ssl/rrglobal/proctor.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 100m;

    location / {
        proxy_pass http://127.0.0.1:8030;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

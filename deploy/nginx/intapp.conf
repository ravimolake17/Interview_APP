# nginx — Interview-app VM (intapp.rrglobal.com)
# Install: sudo apt-get install -y nginx
# Place certs under /etc/ssl/rrglobal/ (do not commit keys)
# Enable: sudo ln -sf /etc/nginx/sites-available/intapp /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name intapp.rrglobal.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name intapp.rrglobal.com;

    # Signed cert + private key from IT (not the CSR)
    ssl_certificate     /etc/ssl/rrglobal/intapp.fullchain.crt;
    ssl_certificate_key /etc/ssl/rrglobal/intapp.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:8030;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
